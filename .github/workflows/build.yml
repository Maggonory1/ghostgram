name: CI

on:
  push:
    branches: [ fix/ios-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check Telegram API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [[ ! "$TELEGRAM_API_ID" =~ ^[0-9]+$ || ! "$TELEGRAM_API_HASH" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "Add TELEGRAM_API_ID and TELEGRAM_API_HASH as repository secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 -c 'import json,os; p="build-system/appstore-configuration.json"; d=json.load(open(p)); d["api_id"]=os.environ["TELEGRAM_API_ID"]; d["api_hash"]=os.environ["TELEGRAM_API_HASH"]; json.dump(d,open(p,"w"))'
          python3 - <<'PY'
          from pathlib import Path
          root = Path("build-system/bazel-rules/rules_apple/apple/internal")
          p = root / "partials/provisioning_profile.bzl"
          text = p.read_text()
          start = text.index("    if not profile_artifact:", text.index("def _provisioning_profile_partial_impl"))
          end = text.index("    # Create intermediate file", start)
          text = text[:start] + "    if not profile_artifact:\n        return struct(bundle_files = [])\n\n" + text[end:]
          p.write_text(text)
          p = root / "codesigning_support.bzl"
          text = p.read_text()
          start = text.index("    if (platform_prerequisites.platform.is_device", text.index("def _validate_provisioning_profile"))
          end = text.index("\ndef _signing_command_lines(", start)
          text = text[:start] + "    pass\n" + text[end:]
          p.write_text(text)
          PY
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"


      - name: Upload experimental IPA
        uses: actions/upload-artifact@v4
        with:
          name: ghostgram-device-build
          path: /Users/Shared/telegram-ios/bazel-bin/Telegram/Telegram.ipa
          if-no-files-found: error
